# .github/workflows/mod_uploader.yml
name: Mod File Uploader - FINAL

on:
  issues:
    types: [opened]

env:
  MAX_FILE_SIZE: 524288000  # 500MB

jobs:
  process-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Parse issue fields
        id: parse_fields
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            
            console.log('=== 调试信息 ===');
            console.log('标题:', title);
            console.log('完整正文 (用于调试):', body);
            console.log('=== 调试结束 ===');
            
            // 1. 验证模板使用
            const usesTemplate = 
              title.includes('[UPLOAD]') || 
              body.includes('重要提示') || 
              body.includes('模组加载器');
            
            if (!usesTemplate) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **未使用正确模板**\n\n请严格遵循以下步骤:\n1. 点击仓库的"Issues"标签\n2. 点击绿色的"New Issue"按钮\n3. **选择"上传模组文件"模板** (不是"Open a blank issue")\n4. 按照模板指引操作`
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed('Invalid template usage');
              return;
            }
            
            // 2. 提取字段 - 适配GitHub实际渲染格式
            let mcVersion = '';
            let loader = '';
            let modVersion = '';
            
            // 方法1: 匹配###标题格式 (GitHub实际渲染格式)
            const sections = body.split('### ');
            for (const section of sections) {
              if (section.startsWith('MC版本')) {
                mcVersion = section.split('\n')[1]?.trim() || '';
              } else if (section.startsWith('模组加载器')) {
                loader = section.split('\n')[1]?.trim().toLowerCase() || '';
              } else if (section.startsWith('模组版本')) {
                modVersion = section.split('\n')[1]?.trim() || '';
              }
            }
            
            console.log('提取结果 (方法1):');
            console.log('MC版本:', mcVersion);
            console.log('加载器:', loader);
            console.log('模组版本:', modVersion);
            
            // 方法2: 备用正则 (兼容其他格式)
            if (!mcVersion || !loader || !modVersion) {
              const mcRegex = /###\s*MC版本\s*\n\s*([^\n]+)/i;
              const loaderRegex = /###\s*模组加载器\s*\n\s*([^\n]+)/i;
              const modRegex = /###\s*模组版本\s*\n\s*([^\n]+)/i;
              
              const mcMatch = body.match(mcRegex);
              const loaderMatch = body.match(loaderRegex);
              const modMatch = body.match(modRegex);
              
              if (mcMatch) mcVersion = mcMatch[1].trim();
              if (loaderMatch) loader = loaderMatch[1].trim().toLowerCase();
              if (modMatch) modVersion = modMatch[1].trim();
            }
            
            console.log('最终提取结果:');
            console.log('MC版本:', mcVersion);
            console.log('加载器:', loader);
            console.log('模组版本:', modVersion);
            
            // 3. 验证必填字段
            const missingFields = [];
            if (!mcVersion) missingFields.push('MC版本');
            if (!loader) missingFields.push('模组加载器');
            if (!modVersion) missingFields.push('模组版本');
            
            if (missingFields.length > 0) {
              let errorMessage = `❌ **缺少必填字段**\n\n检测到的字段值:\n`;
              errorMessage += `- MC版本: \`${mcVersion || '未检测到'}\`\n`;
              errorMessage += `- 模组加载器: \`${loader || '未检测到'}\`\n`;
              errorMessage += `- 模组版本: \`${modVersion || '未检测到'}\`\n\n`;
              
              errorMessage += `**可能原因**:\n`;
              if (!loader) errorMessage += `- GitHub下拉选择框未被正确识别\n`;
              errorMessage += `\n**解决方案**:\n`;
              errorMessage += `1. 编辑Issue，在"模组加载器"字段**手动输入** (forge/neoforge/fabric)\n`;
              errorMessage += `2. 确保每个字段**单独一行** (不要合并)\n`;
              errorMessage += `3. 重新提交Issue`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: errorMessage
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed('Missing required fields');
              return;
            }
            
            // 4. 验证加载器值
            const validLoaders = ['forge', 'neoforge', 'fabric'];
            if (!validLoaders.includes(loader)) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **无效的模组加载器**\n\n检测到: \`${loader}\`\n\n**必须选择以下之一**:\n- forge\n- neoforge\n- fabric\n\n请编辑Issue修正后重新提交`
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed('Invalid loader value');
              return;
            }
            
            // 5. 清理字段值 (创建合法tag)
            const cleanTagPart = (str) => {
              return str.toLowerCase()
                .replace(/[^a-z0-9.+_-]/g, '-') // 替换非法字符
                .replace(/\+/g, '-')            // 特殊处理+号
                .replace(/-+/g, '-')            // 合并连续-
                .replace(/^-+|-+$/g, '');       // 移除前后-
            };
            
            const cleanMcVersion = cleanTagPart(mcVersion);
            const cleanLoader = cleanTagPart(loader);
            const cleanModVersion = cleanTagPart(modVersion);
            
            // 6. 生成tag (v<mc版本>-<加载器>-<模组版本>)
            let releaseTag = `v${cleanMcVersion}-${cleanLoader}-${cleanModVersion}`;
            console.log('生成的Release Tag:', releaseTag);
            
            // 7. 提取附件URL - 修复空格问题
            const urls = [];
            
            // 匹配附件链接 (处理末尾空格)
            const attachmentRegex = /\[([^\]]+?)\]\((https?:\/\/[^\s]+?\.zip[^\s]*?)\s*\)/ig;
            let urlMatch;
            while ((urlMatch = attachmentRegex.exec(body)) !== null) {
              const url = urlMatch[2].trim();
              urls.push(url);
            }
            
            // 备用: 匹配纯URL
            const urlRegex = /(https?:\/\/[^\s)]+?\.zip[^\s)]*)/ig;
            const pureUrls = body.match(urlRegex) || [];
            urls.push(...pureUrls);
            
            // 去重
            const uniqueUrls = [...new Set(urls)];
            console.log('检测到的URL:', uniqueUrls);
            
            if (uniqueUrls.length === 0) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **未检测到.zip文件**\n\n**正确上传步骤**:\n1. 将文件重命名为 \`文件名.jar.zip\`\n2. **直接拖拽**文件到评论框\n3. **等待上传完成** (看到文件名出现在评论框)\n4. 提交Issue\n\nℹ️ 您的文件应显示为类似:\n\`[文件名.jar.zip](https://...)\``
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed('No zip URLs found');
              return;
            }
            
            // 8. 选择第一个有效的.zip URL
            let fileUrl = uniqueUrls.find(url => url.toLowerCase().includes('.jar.zip')) || uniqueUrls[0];
            fileUrl = fileUrl.trim();
            
            // 9. 修复特殊字符
            fileUrl = fileUrl
              .replace(/%2B/g, '+')
              .replace(/%20/g, ' ')
              .replace(/&amp;/g, '&')
              .replace(/&#43;/g, '+')
              .replace(/\s+$/, ''); // 移除末尾空格
            
            console.log('处理后的文件URL:', fileUrl);
            
            // 10. 提取文件名
            let originalName = '';
            try {
              // 从URL获取原始文件名
              const urlObj = new URL(fileUrl, 'https://github.com');
              const path = urlObj.pathname;
              originalName = decodeURIComponent(path.substring(path.lastIndexOf('/') + 1));
              
              // 从URL参数获取 (如果存在)
              const params = new URLSearchParams(urlObj.search);
              if (params.has('name')) {
                originalName = decodeURIComponent(params.get('name'));
              }
            } catch (e) {
              console.log('URL解析失败，使用备用方法');
              const match = fileUrl.match(/\/([^\/?]+?)(?:\?|$)/);
              originalName = match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : 'unknown.zip';
            }
            
            // 11. 智能文件名修复
            let cleanedName = originalName;
            const lowerName = cleanedName.toLowerCase();
            
            if (!lowerName.endsWith('.zip')) {
              cleanedName += '.zip';
            }
            
            if (!lowerName.includes('.jar')) {
              cleanedName = cleanedName.replace(/\.zip$/, '.jar.zip');
            } else {
              cleanedName = cleanedName.replace(/\.jar\.zip$/i, '.jar.zip');
            }
            
            console.log('修复后的文件名:', cleanedName);
            
            // 12. 设置正确的JAR文件名
            let jarName = cleanedName;
            if (jarName.toLowerCase().endsWith('.jar.zip')) {
              jarName = jarName.substring(0, jarName.length - 4); // 移除.zip
            } else if (jarName.toLowerCase().endsWith('.zip')) {
              jarName = jarName.substring(0, jarName.length - 4) + '.jar';
            }
            
            console.log('JAR文件名:', jarName);
            
            // 13. 设置输出
            core.setOutput('file_url', fileUrl);
            core.setOutput('original_name', cleanedName);
            core.setOutput('jar_name', jarName);
            core.setOutput('mc_version', mcVersion);
            core.setOutput('loader', loader);
            core.setOutput('mod_version', modVersion);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('debug_urls', uniqueUrls.join('\n'));

      - name: Download file
        env:
          FILE_URL: ${{ steps.parse_fields.outputs.file_url }}
          OUTPUT_NAME: ${{ steps.parse_fields.outputs.original_name }}
        run: |
          echo "下载URL: $FILE_URL"
          echo "保存为: $OUTPUT_NAME"
          
          # 修正1: 允许文件名中包含 + 号 (适配不同模组作者的命名习惯)
          SAFE_NAME=$(echo "$OUTPUT_NAME" | tr -cd 'a-zA-Z0-9._+-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="mod.jar.zip"
          
          echo "临时文件名: $SAFE_NAME"
          
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 300 \
            --output "$SAFE_NAME" \
            "$FILE_URL"
          
          if [ ! -f "$SAFE_NAME" ]; then
            echo "❌ 下载失败"
            ls -la
            exit 1
          fi
          
          # 修正2: 只有当文件名不同时才执行 mv (避免 1.21.x 等纯净文件名报错)
          if [ "$SAFE_NAME" != "$OUTPUT_NAME" ]; then
            mv "$SAFE_NAME" "$OUTPUT_NAME"
            echo "文件已重命名: $SAFE_NAME -> $OUTPUT_NAME"
          else
            echo "文件名无需修改"
          fi
          
          echo "下载完成: $(stat -c%s "$OUTPUT_NAME") 字节"

      - name: Verify ZIP integrity
        id: verify_zip
        run: |
          FILE="${{ steps.parse_fields.outputs.original_name }}"
          
          # 检查文件大小
          size=$(stat -c%s "$FILE")
          echo "文件大小: $size 字节"
          
          if [ "$size" -gt "${{ env.MAX_FILE_SIZE }}" ]; then
            echo "❌ 文件超过500MB限制"
            exit 1
          fi
          
          if [ "$size" -eq 0 ]; then
            echo "❌ 空文件"
            exit 1
          fi
          
          # 验证ZIP
          if ! unzip -t "$FILE" > /dev/null 2>&1; then
            echo "❌ 无效的ZIP文件"
            unzip -t "$FILE" 2>&1
            exit 1
          fi
          
          # 计算SHA256
          sha256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256_hash=$sha256" >> $GITHUB_OUTPUT
          echo "短哈希: ${sha256:0:8}"

      - name: Check duplicates
        id: check_duplicates
        uses: actions/github-script@v7
        with:
          script: |
            const sha256 = '${{ steps.verify_zip.outputs.sha256_hash }}';
            const shortHash = sha256.substring(0, 8);
            const releaseTag = '${{ steps.parse_fields.outputs.release_tag }}';
            
            try {
              // 检查重复
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `sha256-${sha256}`
              });
              
              // 获取现有文件
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              
              const release = releases.data.find(r => r.tag_name === `sha256-${sha256}`);
              if (release) {
                const jar = release.assets.find(a => a.name.toLowerCase().endsWith('.jar'));
                if (jar) {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `🔄 **重复文件**\n\n此文件已存在:\n📥 [${jar.name}](${jar.browser_download_url})\n🔖 哈希: \`${shortHash}...\``
                  });
                  await github.rest.issues.update({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'closed'
                  });
                  core.setOutput('duplicate', 'true');
                  core.setOutput('download_url', jar.browser_download_url);
                  core.setOutput('short_hash', shortHash);
                  return;
                }
              }
            } catch (error) {
              if (error.status !== 404) {
                console.log('检查重复时出错:', error.message);
              }
            }
            
            // 检查是否已存在相同tag的Release
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag
              });
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **相同版本已存在**\n\n相同版本(\`${releaseTag}\`)的文件已存在。如果那个文件的版本号有误，请联系仓库管理员或为此创建一个Issue。`
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed('Duplicate version tag');
              return;
            } catch (error) {
              if (error.status !== 404) {
                console.log('检查版本标签时出错:', error.message);
              }
            }
            
            core.setOutput('duplicate', 'false');
            core.setOutput('short_hash', shortHash);

      - name: Rename to JAR
        if: steps.check_duplicates.outputs.duplicate == 'false'
        run: |
          mv "${{ steps.parse_fields.outputs.original_name }}" "${{ steps.parse_fields.outputs.jar_name }}"
          echo "重命名为JAR完成: ${{ steps.parse_fields.outputs.jar_name }}"

      - name: Create release
        id: create_release
        if: steps.check_duplicates.outputs.duplicate == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { createReadStream } = require('fs');
            const { basename } = require('path');
            
            const releaseTag = '${{ steps.parse_fields.outputs.release_tag }}';
            const releaseName = releaseTag;
            const jarFile = '${{ steps.parse_fields.outputs.jar_name }}';
            const jarName = basename(jarFile);
            const fileSize = fs.statSync(jarFile).size;
            
            const timestamp = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '');
            const body = `✅ 上传自 Issue #${context.issue.number}\n\n` +
                         `📦 **详细信息**\n` +
                         `- MC版本: ${{ steps.parse_fields.outputs.mc_version }}\n` +
                         `- 加载器: ${{ steps.parse_fields.outputs.loader }}\n` +
                         `- 模组版本: ${{ steps.parse_fields.outputs.mod_version }}\n` +
                         `- 文件哈希: ${{ steps.check_duplicates.outputs.short_hash }}...\n\n` +
                         `⚠️ **注意**: 仅仓库管理员可删除此文件\n\n` +
                         `📅 上传时间: ${timestamp}`;
            
            try {
              // 创建Release
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: releaseTag,
                name: releaseName,
                body: body,
                draft: false,
                prerelease: false
              });
              
              // 上传文件 - 关键修复：添加data参数名
              const asset = await github.rest.repos.uploadReleaseAsset({
                url: release.data.upload_url,
                headers: {
                  'content-length': fileSize,
                  'content-type': 'application/java-archive'
                },
                name: jarName,
                data: createReadStream(jarFile) // 修复：添加data参数名
              });
              
              core.setOutput('release_url', release.data.html_url);
              core.setOutput('download_url', asset.data.browser_download_url);
            } catch (error) {
              console.error('创建Release失败:', error);
              core.setFailed(`上传失败: ${error.message || '未知错误'}`);
            }

      - name: Comment success
        if: steps.check_duplicates.outputs.duplicate == 'false' && steps.create_release.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const downloadUrl = '${{ steps.create_release.outputs.download_url }}';
            const releaseUrl = '${{ steps.create_release.outputs.release_url }}';
            const shortHash = '${{ steps.check_duplicates.outputs.short_hash }}';
            const releaseTag = '${{ steps.parse_fields.outputs.release_tag }}';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **上传成功!**\n\n🏷️ **版本**: \`${releaseTag}\`\n📥 [下载文件](${downloadUrl})\n📦 [所有文件](${releaseUrl})\n🔖 哈希: \`${shortHash}...\``
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });

      - name: Cleanup
        if: always()
        run: |
          echo "清理文件..."
          rm -f *.zip *.jar || true
          echo "清理完成"
